# Kirin Linux defaults for kitty. Change anything in ~/.config/kitty/kitty.conf.
# Live adjust: Ctrl+Shift+A then M / L to raise / lower opacity.

font_family          monospace
font_size            11.0
window_padding_width 10
confirm_os_window_close 0
enable_audio_bell    no
remember_window_size yes
initial_window_width  100c
initial_window_height 30c

# Translucency with blur (KWin, which UKUI uses, honours the blur request)
background_opacity         0.85
background_blur            32
dynamic_background_opacity yes

# Kirin colours: night blue with the logo's cyan-blue accents
foreground            #d8e2ee
background            #0e131c
cursor                #4fb8ff
cursor_text_color     #0e131c
selection_foreground  #ffffff
selection_background  #1d6fb8
url_color             #4fb8ff
active_border_color   #2a9df4
inactive_border_color #22303f
active_tab_foreground   #ffffff
active_tab_background   #1d6fb8
inactive_tab_foreground #8fa3b8
inactive_tab_background #141b26
tab_bar_style         powerline

color0  #141b26
color8  #3b4a5e
color1  #e5677a
color9  #ff8a9b
color2  #7ccf9a
color10 #9fe6b9
color3  #e8c177
color11 #ffd896
color4  #2a9df4
color12 #6cc0ff
color5  #b48cf2
color13 #cfb0ff
color6  #4fd1d9
color14 #8ce9ee
color7  #c4d0dd
