set default=0
set timeout=3

set color_normal=white/black
set color_highlight=black/light-gray

if loadfont /boot/grub/unicode.pf2 ; then
        set gfxmode=auto
        insmod efi_gop
        insmod efi_uga
        insmod gfxterm
        terminal_output gfxterm
fi


menuentry "Try without installing" {
linux		/casper/vmlinuz boot=casper locale=zh_CN quiet splash live ignore_uuid
initrd		/casper/initrd.lz
}
menuentry "Install openKylin" {
linux		/casper/vmlinuz boot=casper only-ubiquity locale=zh_CN quiet splash ignore_uuid
initrd		/casper/initrd.lz
}
menuentry "Try to fix grub for local system" {
linux		/casper/vmlinuz boot=casper locale=zh_CN quiet splash live ignore_uuid kyrecover
initrd		/casper/initrd.lz
}
#	 "Other"
menuentry	"memtest86+" {
linux16	casper/memtest
}
